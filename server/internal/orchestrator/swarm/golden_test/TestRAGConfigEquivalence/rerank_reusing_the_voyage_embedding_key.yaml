server:
  listen_address: 0.0.0.0
  port: 8080
pipelines:
- name: default
  database:
    host: postgres-storefront-n1-aaaa
    port: 5432
    database: storefront
    username: rag_user
    password: secret
    ssl_mode: prefer
  tables:
  - table: docs
    text_column: content
    vector_column: embedding
  embedding_llm:
    provider: voyage
    model: voyage-3
  rag_llm:
    provider: anthropic
    model: claude-sonnet-4-5
  api_keys:
    anthropic: /app/keys/default_rag.key
    voyage: /app/keys/default_embedding.key
  rerank:
    provider: voyage
    model: rerank-2
