server:
  listen_address: 0.0.0.0
  port: 8080
pipelines:
- name: local
  database:
    host: postgres-storefront-n1-aaaa
    port: 5432
    database: storefront
    username: rag_user
    password: secret
    ssl_mode: prefer
  tables:
  - table: docs
    text_column: content
    vector_column: embedding
  embedding_llm:
    provider: ollama
    model: nomic-embed-text
  rag_llm:
    provider: ollama
    model: llama3
