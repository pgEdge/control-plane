http:
  enabled: true
  address: :8080
  auth:
    enabled: true
    token_file: /app/data/tokens.yaml
    user_file: /app/data/users.yaml
databases:
- name: mydb
  hosts:
  - host: postgres-inst-1
    port: 5432
  database: mydb
  user: app
  password: secret
  sslmode: prefer
  allow_writes: false
  pool:
    max_conns: 4
builtins:
  tools:
    query_database: false
    get_schema_info: false
    similarity_search: false
    execute_explain: false
    generate_embedding: false
    search_knowledgebase: false
    count_rows: false
    llm_connection_selection: false
