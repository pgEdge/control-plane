server:
  listen_address: 0.0.0.0
  port: 3300
pipelines:
- name: default
  database:
    host: 10.0.0.1
    port: 6432
    database: storefront
    username: rag_user
    password: secret
    ssl_mode: prefer
  tables:
  - table: docs
    text_column: content
    vector_column: embedding
  embedding_llm:
    provider: openai
    model: text-embedding-3-small
  rag_llm:
    provider: anthropic
    model: claude-sonnet-4-5
  api_keys:
    anthropic: /etc/pgedge-rag/inst-1/keys/default_rag.key
    openai: /etc/pgedge-rag/inst-1/keys/default_embedding.key
    voyage: /etc/pgedge-rag/inst-1/keys/default_rerank.key
  rerank:
    provider: voyage
    model: rerank-2
defaults:
  top_n: 10
