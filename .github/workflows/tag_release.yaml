name: tag_release

# Temporarily disabled: v0.10.0 was tagged manually, so this must not
# fire again when the release/v0.10.0 PR is merged. Revert this in a
# follow-up PR against main once that PR is merged.
on:
  workflow_dispatch: {}

jobs:
  tag_release:
    if: ${{ github.event.pull_request.merged && startsWith(github.event.pull_request.head.ref, 'release/') }}
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Tag release
        env:
          branch_name: ${{ github.event.pull_request.head.ref }}
        run: |
          version=${branch_name#release/}

          # ensure release notes exist
          ls changes/${version}.md

          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

          git tag -a -F changes/${version}.md ${version}
          git push origin ${version}
