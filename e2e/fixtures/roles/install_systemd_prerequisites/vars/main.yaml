---
_arch_transform:
  amd64: amd64
  x86_64: amd64
  aarch64: arm64
  arm64: arm64

# RPM package names
_rpm_packages:
  - "pgedge-postgresql{{ pg_version }}"
  - "pgedge-spock{{ spock_version }}0_{{ pg_version }}"
  - "pgedge-postgresql{{ pg_version }}-contrib"
  - pgedge-pgbackrest
  - pgedge-patroni

# DEB package names
_deb_packages:
  - "pgedge-postgresql-{{ pg_version }}"
  - "pgedge-postgresql-{{ pg_version }}-spock{{ spock_version }}0"
  - pgedge-pgbackrest
  - pgedge-patroni

