---
# ── First host: initialize cluster ────────────────────────────────────────────

- name: Initialize cluster on first host
  uri:
    url: http://localhost:3000/v1/cluster/init
    method: GET
    status_code: [200, 204, 409]
  register: _init_result
  when: inventory_hostname == first_host

- name: Get join token from first host
  uri:
    url: http://localhost:3000/v1/cluster/join-token
    method: GET
    status_code: 200
  register: _join_token_result
  retries: 15
  delay: 2
  until: _join_token_result.json.token is not none and _join_token_result.json.token != ""
  when: inventory_hostname == first_host

- name: Store join token as global fact
  set_fact:
    _cluster_join_token: "{{ _join_token_result.json.token }}"
    _cluster_server_urls: "{{ _join_token_result.json.server_urls }}"
  delegate_to: localhost
  delegate_facts: true
  when: inventory_hostname == first_host

# ── Other hosts: join cluster ─────────────────────────────────────────────────

- name: Join cluster on remaining hosts
  uri:
    url: http://localhost:3000/v1/cluster/join
    method: POST
    body_format: json
    body:
      token: "{{ hostvars['localhost']._cluster_join_token }}"
      server_urls: "{{ hostvars['localhost']._cluster_server_urls }}"
    status_code: [200, 204, 409]
  when: inventory_hostname != first_host

- name: Wait for all hosts to be healthy
  uri:
    url: "http://{{ hostvars[first_host].peer_ip }}:3000/v1/hosts"
    method: GET
    status_code: 200
  register: _hosts_result
  retries: 60
  delay: 5
  until: >
    (_hosts_result.json.hosts | selectattr('status.state', 'equalto', 'healthy') | list | length)
    == (machines | length)
  run_once: true
  delegate_to: "{{ first_host }}"
