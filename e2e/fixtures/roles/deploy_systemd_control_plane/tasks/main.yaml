---
- name: Write CP configuration
  copy:
    dest: /etc/pgedge-control-plane/config.json
    content: |
      {
        "orchestrator": "systemd",
        "data_dir": "/var/lib/pgedge-control-plane",
        "host_id": "{{ inventory_hostname }}",
        "peer_addresses": ["{{ peer_ip }}"],
        "client_addresses": ["{{ external_ip }}"]
      }
    owner: root
    group: root
    mode: '0644'

- name: Start and enable pgedge-control-plane
  systemd_service:
    name: pgedge-control-plane
    state: started
    enabled: true
    daemon_reload: true

- name: Wait for CP API to be ready
  uri:
    url: http://localhost:3000/v1/version
    status_code: 200
  register: _cp_ready
  retries: 60
  delay: 5
  until: _cp_ready.status == 200
