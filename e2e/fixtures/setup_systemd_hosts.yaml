---
- name: Gather facts
  hosts: all
  gather_facts: true
  roles:
    - role: lima_facts
      when: provider == 'lima'
    - role: ec2_facts
      when: provider == 'ec2'

- name: Set shared facts
  hosts: localhost
  gather_facts: false
  roles:
    - role: host_facts_systemd

- name: Install pgEdge prerequisites
  hosts: all
  gather_facts: true
  become: true
  roles:
    - role: install_systemd_prerequisites
