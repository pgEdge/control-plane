---
use_staging_packages: false
# Client certificate for the gated pgEdge repositories. Read from files on the
# controller rather than passed on the command line, so the PEM never lands in
# argv. Override the paths with PGEDGE_CLIENT_CERT_FILE / PGEDGE_CLIENT_KEY_FILE.
pgedge_client_cert_file: "{{ lookup('env', 'PGEDGE_CLIENT_CERT_FILE') | default('~/.pgedge/client.crt', true) }}"
pgedge_client_key_file: "{{ lookup('env', 'PGEDGE_CLIENT_KEY_FILE') | default('~/.pgedge/client.key', true) }}"
pgedge_client_cert: "{{ lookup('file', pgedge_client_cert_file | expanduser, errors='ignore') | default('', true) }}"
pgedge_client_key: "{{ lookup('file', pgedge_client_key_file | expanduser, errors='ignore') | default('', true) }}"

os: rocky-9
machines:
  - name: control-plane-dev-1
    http_port: 3010
    host_id: host-1
  - name: control-plane-dev-2
    http_port: 3011
    host_id: host-2
  - name: control-plane-dev-3
    http_port: 3012
    host_id: host-3
  - name: control-plane-dev-4
    http_port: 3013
    host_id: host-4
  - name: control-plane-dev-5
    http_port: 3014
    host_id: host-5
  - name: control-plane-dev-6
    http_port: 3015
    host_id: host-6
