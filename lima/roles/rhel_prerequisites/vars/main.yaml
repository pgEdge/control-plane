---
_arch_transform:
  amd64: amd64
  x86_64: amd64
  aarch64: arm64
  arm64: arm64
etcd_version: v3.6.5
etcd_archive_name: etcd-{{ etcd_version }}-linux-{{ _arch_transform[ansible_facts.architecture] }}
etcd_download_url: https://github.com/etcd-io/etcd/releases/download/{{ etcd_version }}/{{ etcd_archive_name }}.tar.gz
go_version: 1.25.5
go_archive_name: go{{ go_version }}.linux-{{ _arch_transform[ansible_facts.architecture] }}.tar.gz
go_download_url: https://dl.google.com/go/{{ go_archive_name }}
pgedge_packages:
  - pgedge-postgresql18
  - pgedge-postgresql17
  - pgedge-postgresql16
  - "pgedge-spock{{ spock_major | default('50') }}_18"
  - "pgedge-spock{{ spock_major | default('50') }}_17"
  - "pgedge-spock{{ spock_major | default('50') }}_16"
  - pgedge-snowflake_18
  - pgedge-snowflake_17
  - pgedge-snowflake_16
  - pgedge-lolor_18
  - pgedge-lolor_17
  - pgedge-lolor_16
  - pgedge-postgresql18-contrib
  - pgedge-postgresql17-contrib
  - pgedge-postgresql16-contrib
  - pgedge-patroni
  - pgedge-pgbackrest
# Every known Spock major's packages, regardless of which one spock_major
# currently selects. Spock majors conflict with each other at the
# package-manager level, so switching spock_major on an already-provisioned
# host requires uninstalling every other major first (see "Remove all known
# Spock packages" in tasks/main.yaml) -- add new majors here as they ship.
pgedge_all_spock_packages:
  - pgedge-spock50_18
  - pgedge-spock50_17
  - pgedge-spock50_16
  - pgedge-spock60_18
  - pgedge-spock60_17
  - pgedge-spock60_16
