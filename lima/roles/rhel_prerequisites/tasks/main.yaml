---
- name: Install base prerequisites
  ansible.builtin.package:
    name: '{{ item }}'
    state: present
  loop:
    - epel-release
    - dnf
    - which
    - wget
    - git
- name: Enable crb
  community.general.dnf_config_manager:
    name: crb
    state: enabled
# Imported explicitly rather than left to dnf's auto-import from the repo's
# gpgkey=. The RPM and DEB repositories are signed with different keys, so this
# is keys/dnf specifically.
- name: Install the pgEdge package signing key
  ansible.builtin.rpm_key:
    key: https://downloads.pgedge.com/keys/dnf/pgedge-rsa.pub
    state: present
# downloads.pgedge.com, not dnf.pgedge.com: the gated repository cannot serve
# the package that configures access to it. The repo package itself is
# unsigned, hence disable_gpg_check here and nowhere else.
- name: Install pgEdge repository
  ansible.builtin.package:
    name: https://downloads.pgedge.com/reporpm/pgedge-release-latest.noarch.rpm
    state: present
    disable_gpg_check: true
- name: Reconfigure pgEdge repository for staging packages
  ansible.builtin.replace:
    path: /etc/yum.repos.d/pgedge.repo
    regexp: release
    replace: staging
  when: use_staging_packages | bool
  register: repo_reconfigured_to_staging
- name: Reconfigure pgEdge repository for release packages
  ansible.builtin.replace:
    path: /etc/yum.repos.d/pgedge.repo
    regexp: staging
    replace: release
  when: not (use_staging_packages | bool)
  register: repo_reconfigured_to_release
- name: Install the pgEdge client certificate and enable the repositories
  when: pgedge_client_cert | default('') | length > 0
        and pgedge_client_key | default('') | length > 0
  block:
  - name: Create the pgEdge configuration directory
    ansible.builtin.file:
      path: "/etc/pki/pgedge"
      state: directory
      owner: root
      group: root
      mode: '0755'
  - name: Write the client certificate
    ansible.builtin.copy:
      content: "{{ pgedge_client_cert | trim }}\n"
      dest: "/etc/pki/pgedge/client.crt"
      owner: root
      group: root
      mode: '0644'
    no_log: true
  # Ownership and mode are left to pgedge-subscription-manager: apt reads the
  # key as _apt, dnf as root.
  - name: Write the client key
    ansible.builtin.copy:
      content: "{{ pgedge_client_key | trim }}\n"
      dest: "/etc/pki/pgedge/client.key"
      owner: root
      group: root
      mode: '0600'
    no_log: true
  - name: Validate the certificate and enable the pgEdge repositories
    ansible.builtin.command: >-
      pgedge-subscription-manager install
      /etc/pki/pgedge/client.crt /etc/pki/pgedge/client.key --force
    changed_when: true

- name: Warn when no pgEdge client certificate was supplied
  ansible.builtin.debug:
    msg: >-
      No pgEdge client certificate supplied for this run. Any existing
      repository configuration is left as it is, and installing pgEdge packages
      may fail. Put the certificate and key at ~/.pgedge/client.crt and
      ~/.pgedge/client.key, or point PGEDGE_CLIENT_CERT_FILE and
      PGEDGE_CLIENT_KEY_FILE at them.
  when: not (pgedge_client_cert | default('') | length > 0
             and pgedge_client_key | default('') | length > 0)

- name: Track configured Spock major for reinstall detection
  ansible.builtin.copy:
    content: "{{ spock_major | default('50') }}"
    dest: /etc/pgedge-control-plane-dev-spock-major
  register: spock_major_reconfigured
- name: Remove all known Spock packages before switching Spock major
  ansible.builtin.package:
    name: '{{ item }}'
    state: absent
  loop: '{{ pgedge_all_spock_packages }}'
  when: spock_major_reconfigured.changed
- name: Remove pgEdge packages for reinstall
  ansible.builtin.package:
    name: '{{ item }}'
    state: absent
  loop: '{{ pgedge_packages }}'
  when: repo_reconfigured_to_staging.changed or repo_reconfigured_to_release.changed or spock_major_reconfigured.changed
- name: Install pgEdge packages
  ansible.builtin.package:
    name: '{{ item }}'
    state: present
  loop: '{{ pgedge_packages }}'
- name: Install etcdctl and etcdutl
  ansible.builtin.unarchive:
    src: "{{ etcd_download_url }}"
    dest: /usr/bin
    remote_src: yes
    extra_opts:
      - "--strip-components=1"
      - "{{ etcd_archive_name }}/etcdctl"
      - "{{ etcd_archive_name }}/etcdutl"
    creates: /usr/bin/etcdctl
- name: Install Go
  ansible.builtin.unarchive:
    src: "{{ go_download_url }}"
    dest: /usr/local
    remote_src: yes
    creates: /usr/local/go
- name: Add profile environment
  ansible.builtin.copy:
    content: |
      export PATH=$PATH:/usr/local/go/bin
    dest: /etc/profile.d/control-plane-dev.sh
    mode: '0755'
- name: Allow large time jumps in chronyd
  ansible.builtin.lineinfile:
    path: /etc/chrony.conf
    regexp: '^makestep'
    line: 'makestep 1 -1'
  register: chronycfg
- name: Restart chronyd
  ansible.builtin.systemd_service:
    name: chronyd
    state: restarted
  when: chronycfg.changed
- name: Install delve debugger
  ansible.builtin.command: /usr/local/go/bin/go install github.com/go-delve/delve/cmd/dlv@v1.25.2
  args:
    creates: /root/go/bin/dlv
- name: Fix clocks
  ansible.builtin.command: chronyc -a makestep
  changed_when: false
